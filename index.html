<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ولاء 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#ffd1e3,#ffb3d1 50%,#ff8fb8);color:#6b0f3a;text-align:center;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;transition:opacity .8s}
  #second{opacity:0;pointer-events:none}
  .show #first{opacity:0;pointer-events:none}
  .show #second{opacity:1;pointer-events:auto}
  .big{font-size:5rem;animation:beat 1.2s infinite}
  h1{font-size:1.7rem;font-weight:900;line-height:1.7}
  button{font-family:inherit;font-size:1.2rem;font-weight:700;padding:14px 32px;border:none;border-radius:40px;background:#e6196b;color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(230,25,107,.4);animation:beat 1.5s infinite}
  .photo{width:min(56vw,240px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 12px 32px rgba(107,15,58,.35);animation:pop 1s ease both}
  #second h1{animation:pop 1.2s .3s ease both}
  #second p{font-size:1.4rem;font-weight:700;animation:pop 1.2s .6s ease both}
  #second{overflow-y:auto}
  .heart{position:fixed;bottom:-40px;font-size:1.6rem;animation:rise linear forwards;pointer-events:none;z-index:5}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
  @keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style>
</head>

<!-- الأغنية: SoundCloud تشتغل تلقائيًا بعد الضغط على الزر -->
<div id="songbox" style="position:fixed;left:-1000px;bottom:10px;width:min(92vw,360px);height:166px;z-index:20;border-radius:14px;overflow:hidden"></div>
<div id="note" style="position:fixed;left:0;right:0;bottom:184px;z-index:20;display:none;text-align:center;font-weight:700;color:#6b0f3a">اضغطي ▶️ لتشغيل الأغنية 🎶</div>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
  var SRC='https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A1806236622&color=%23ff5500&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false';
  function spawn(){
    var h=document.createElement('div');
    h.className='heart';
    h.textContent=['💖','💗','💕','❤️','🌸'][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*100+'vw';
    h.style.animationDuration=(4+Math.random()*4)+'s';
    document.body.appendChild(h);
    setTimeout(function(){h.remove()},8500);
  }
  document.getElementById('btn').addEventListener('click',function(){
    document.body.classList.add('show');
    setInterval(spawn,350);

    var box=document.getElementById('songbox'), note=document.getElementById('note');
    var f=document.createElement('iframe');
    f.width='100%'; f.height='166'; f.scrolling='no'; f.frameBorder='no';
    f.allow='autoplay; encrypted-media';
    f.style.border='0';
    f.src=SRC;
    box.appendChild(f);

    var started=false;
    try{
      var w=SC.Widget(f);
      w.bind(SC.Widget.Events.READY,function(){ w.play(); });
      w.bind(SC.Widget.Events.PLAY,function(){
        started=true;
        note.style.display='none';
        box.style.left='-1000px';
      });
      w.bind(SC.Widget.Events.FINISH,function(){ w.seekTo(0); w.play(); });
    }catch(e){}

    // لو المتصفح منع التشغيل التلقائي، يظهر المشغّل لتضغطي تشغيل
    setTimeout(function(){
      if(!started){
        box.style.left='50%';
        box.style.transform='translateX(-50%)';
        note.style.display='block';
      }
    },3500);
  });
</script>
